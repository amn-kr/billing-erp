name: CI

# Owner, 13 Nov 2026: no checks on GitHub (the repository is private and GitHub's minutes cost money).
# Every check runs on the Mac instead: `pnpm check` (tools/check/check-all.sh). This workflow runs only
# when someone starts it by hand (Actions › CI › Run workflow).
on:
  workflow_dispatch:

# A newer push to the same PR stops its older run, which would be out of date anyway.
# Runs on main are never cancelled (each commit has its own group).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read # to look up the PR run that already tested the same files

# The check runs on seven machines at once: quick checks on one, the browser and picture tests split
# into 4 parts on four more, the Windows app's tests on one, and the `test` job (the required check) collects the results.
# Every job stays on Ubuntu 24.04: "ubuntu-latest" moved to 26.04 (Oct 2026), where Playwright 1.56 can't
# install its browser, and the approved pictures were all taken on 24.04.
jobs:
  # After a merge: did a green PR run already test exactly these files? A clear yes skips the quick
  # checks and the flow tests, and runs only the picture tests at 1280 and 1920 px (the PR checked
  # 1366 px); anything missing or unclear runs the full check (see .github/scripts/already-tested.sh).
  already-tested:
    name: Same files already tested on the PR?
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.find.outputs.run }}
      url: ${{ steps.find.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        name: Look for a green PR run of these exact files
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/already-tested.sh

  skipped:
    name: Quick checks and flow tests skipped - these exact files already passed on the PR
    needs: already-tested
    if: needs.already-tested.outputs.run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Where they passed
        env:
          URL: ${{ needs.already-tested.outputs.url }}
        run: |
          echo "These exact files passed the quick checks, the flow tests and the 1366 px pictures on the PR: $URL"
          echo "Quick checks and flow tests skipped: these exact files already passed on the PR: $URL" >> "$GITHUB_STEP_SUMMARY"

  # Runs on every pull request and every push: decides which tests run and at which picture widths
  # (one plain sentence about it on the run's summary page).
  changes:
    name: What changed (decides which tests and picture widths run)
    needs: already-tested
    # !cancelled() because GitHub would otherwise skip this job whenever already-tested was skipped (every PR)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tree: ${{ steps.changes.outputs.tree }}
      run_e2e: ${{ steps.plan.outputs.run_e2e }}
      quick_checks: ${{ steps.plan.outputs.quick_checks }}
      widths: ${{ steps.plan.outputs.widths }}
      pictures_only: ${{ steps.plan.outputs.pictures_only }}
      skip_visual: ${{ steps.plan.outputs.skip_visual }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: changes
        name: What changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          # a pull request pushed again: compared with its last green CI run too (see changes.sh)
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: bash .github/scripts/changes.sh
      - id: plan
        name: Which tests run
        env:
          EVENT: ${{ github.event_name }}
          ALREADY_TESTED_RUN: ${{ needs.already-tested.outputs.run }}
          DOCS_ONLY: ${{ steps.changes.outputs.docs_only }}
          WEB_UNCHANGED: ${{ steps.changes.outputs.web_unchanged }}
          VISUAL_NEEDED: ${{ steps.changes.outputs.visual_needed }}
          APPROVED_CHANGED: ${{ steps.changes.outputs.approved_changed }}
        run: bash .github/scripts/picture-plan.sh

  quick-checks:
    name: Quick checks (brand, typecheck, unit and API tests, build)
    needs: changes
    # run only after What changed ran, and not after a merge that already passed them on the PR;
    # !cancelled() because GitHub would otherwise skip this job whenever an earlier job in the chain
    # was skipped (already-tested is skipped on every pull request)
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.quick_checks != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Create database roles
        run: psql -h localhost -U postgres -f infra/db/init-ci.sql
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @billing/web exec playwright --version | tail -n 1 | tr -dc '0-9.')" >> "$GITHUB_OUTPUT"
      - name: Cached Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browser (the importer's tests use it)
        run: pnpm --filter @billing/web exec playwright install --with-deps chromium
      - name: Brand check (the app's name is read from packages/shared/src/brand.ts everywhere)
        run: pnpm brand:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and API tests
        run: pnpm test
      - name: Build
        run: pnpm build

  # The browser and picture tests, split into 4 parts by test file (Playwright --shard). Each part
  # has its own machine and its own fresh database. One part failing does not stop the others.
  e2e:
    name: Browser and picture tests (part ${{ matrix.part }} of 4)
    needs: changes
    # run only after What changed ran; !cancelled() because GitHub would otherwise skip this job whenever
    # an earlier job in the chain was skipped (already-tested is skipped on every pull request)
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-24.04
    # one part takes about a quarter of the old 50 minutes
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Create database roles
        run: psql -h localhost -U postgres -f infra/db/init-ci.sql
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @billing/web exec playwright --version | tail -n 1 | tr -dc '0-9.')" >> "$GITHUB_OUTPUT"
      - name: Cached Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browser
        run: pnpm --filter @billing/web exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      # Which tests and widths: see the What changed job (empty widths = all three).
      # --pass-with-no-tests: a part left with no test (e.g. pictures skipped) is not a failure.
      - name: End-to-end and screenshot tests, part ${{ matrix.part }} of 4 (rebuild vs prototype at ${{ needs.changes.outputs.widths || '1280/1366/1920' }})
        if: needs.changes.outputs.run_e2e == 'true'
        env:
          PICTURE_WIDTHS: ${{ needs.changes.outputs.widths }}
          PICTURES_ONLY: ${{ needs.changes.outputs.pictures_only }}
          SKIP_VISUAL: ${{ needs.changes.outputs.skip_visual }}
          # after a merge a failed picture is reported in plain words with its width (e2e/summary-reporter.ts)
          AFTER_MERGE: ${{ github.event_name == 'push' && '1' || '' }}
        run: pnpm --filter @billing/web e2e --shard=${{ matrix.part }}/4 --pass-with-no-tests
      - name: Browser and picture tests skipped (the reason is on the What changed job)
        if: needs.changes.outputs.run_e2e != 'true'
        run: echo "Browser and picture tests skipped - see What changed for the reason"
      # each part saves its own pictures; the test job also puts all parts together in visual-diffs
      - name: Upload screenshot differences (this part)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-part-${{ matrix.part }}
          path: apps/web/test-results/
          retention-days: 7
          overwrite: true

  # The Windows app (apps/desktop): opened in Electron on a test copy of the app, its screens compared
  # with the prototype drawn in the same Electron, plus its link and "Not connected" checks.
  desktop:
    name: Windows app tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.quick_checks != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Create database roles
        run: psql -h localhost -U postgres -f infra/db/init-ci.sql
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @billing/web exec playwright --version | tail -n 1 | tr -dc '0-9.')" >> "$GITHUB_OUTPUT"
      - name: Cached Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # the test shop's seed uses Playwright's Chrome (the importer), and Electron needs the same system libraries
      - name: Install Playwright browser and system libraries
        run: pnpm --filter @billing/web exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      # Linux only (the test machine): Electron's security sandbox helper must belong to root, as an
      # installed Linux app's would; this keeps the sandbox on instead of switching it off
      - name: Electron, with its sandbox helper set up
        working-directory: apps/desktop
        run: |
          node scripts/ensure-electron.cjs
          helper="$(dirname "$(node -p "require('electron')")")/chrome-sandbox"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
      - name: Windows app tests (Electron, on a virtual screen)
        run: xvfb-run --auto-servernum pnpm --filter @billing/desktop e2e
      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-visual-diffs
          path: apps/desktop/test-results/
          retention-days: 7
          overwrite: true

  # The required check (the `protect main` ruleset needs a check named exactly `test`). It always runs
  # and is green only when every job above passed; after a merge whose files already passed on the
  # PR, the quick checks are skipped on purpose and only the pictures must pass (see .github/scripts/gate.sh).
  test:
    needs: [already-tested, changes, quick-checks, e2e, desktop]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # one download with every failed part's pictures, in folders visual-diffs-part-1 … 4
      - name: Put the screenshot differences of all parts together
        if: needs.e2e.result == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact/merge@v4
        with:
          name: visual-diffs
          pattern: visual-diffs-part-*
          separate-directories: true
          retention-days: 7
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Did every part pass?
        env:
          ALREADY_TESTED_RUN: ${{ needs.already-tested.outputs.run }}
          ALREADY_TESTED_URL: ${{ needs.already-tested.outputs.url }}
          CHANGES: ${{ needs.changes.result }}
          QUICK: ${{ needs.quick-checks.result }}
          E2E: ${{ needs.e2e.result }}
          DESKTOP: ${{ needs.desktop.result }}
        run: bash .github/scripts/gate.sh
      # a fingerprint of the files this green PR run tested, so the run after the merge can skip
      # the same work (see the already-tested job)
      - name: Remember the tested files
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TREE: ${{ needs.changes.outputs.tree }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: mkdir -p tested && echo "$TREE $PR_URL" > tested/tree.txt
      - if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: tested-tree-${{ needs.changes.outputs.tree }}
          path: tested/tree.txt
          retention-days: 30
          overwrite: true
