name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Create database roles
        run: psql -h localhost -U postgres -f infra/db/init-ci.sql
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and API tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @billing/web exec playwright install --with-deps chromium
      - name: End-to-end and screenshot tests (rebuild vs prototype at 1280/1366/1920)
        run: pnpm --filter @billing/web e2e
      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: apps/web/test-results/
          retention-days: 7
