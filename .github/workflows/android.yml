name: Phone app

# Builds the Android app (apps/android) on every change (owner, 18 Nov 2026: the repository is public,
# so these builds are free). It runs the app's tests first (only the 20 colours, …); the test APK is
# kept for 14 days under the run's Artifacts, to install on a phone.
# Signed releases for Check For Update come with the signing key (step 8.2e).
on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'packages/shared/examples/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'packages/shared/examples/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: Phone app (tests and APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, then the test APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Keep the test APK
        uses: actions/upload-artifact@v4
        with:
          name: BillinGo-test-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Keep the test report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phone-app-test-report
          path: apps/android/app/build/reports/tests/
          retention-days: 7
