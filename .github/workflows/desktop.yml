name: Windows app

# Makes the Windows installer (Setup.exe) on GitHub's Windows machine, installs it there and opens the
# installed app to check it starts.
#   pull request touching the app: the installer is kept for 14 days under the run's Artifacts, to try it
#   tag v<version> (= apps/desktop/package.json version): also put on GitHub Releases, where the
#   installed apps find it and update themselves
on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer:
    name: Windows installer
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write # only used on a tag, to publish the release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(node -p "require('./apps/desktop/package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "Tag $GITHUB_REF_NAME does not match apps/desktop/package.json ($want)"; exit 1; }
      - name: Build the shared package
        run: pnpm exec turbo run build --filter=@billing/shared
      - name: Make the installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: pnpm --filter @billing/desktop package
      - name: Make the installer and publish it on GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @billing/desktop package -- --publish
      - name: Install it (silently, for this Windows user)
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/release/*-Setup-*.exe | Select-Object -First 1
          Write-Host "Installing $($setup.Name) ($([math]::Round($setup.Length / 1MB)) MB)"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter billing-erp.exe | Select-Object -First 1
          if (-not $exe) { throw 'The installed app was not found' }
          "EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Open the installed app
        working-directory: apps/desktop
        run: node scripts/smoke-installed.mjs "$EXE"
      - name: Keep the installer (Artifacts, 14 days)
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/release/*-Setup-*.exe
          retention-days: 14
