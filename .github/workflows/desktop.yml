name: Windows app

# Makes the Windows installer (Setup.exe) on GitHub's Windows machine, installs it there and opens the
# installed app to check it starts.
#   pull request touching the app: the installer is kept for 14 days under the run's Artifacts, to try it
#   tag v<version> (= apps/desktop/package.json version): also put on GitHub Releases, where the
#   installed apps find it and update themselves
on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer:
    name: Windows installer
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write # only used on a tag, to publish the release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(node -p "require('./apps/desktop/package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "Tag $GITHUB_REF_NAME does not match apps/desktop/package.json ($want)"; exit 1; }
      # the Windows app carries the server (apps/api) and the app's pages (apps/web) for single-PC mode
      - name: Build the server, the pages and the shared package
        run: pnpm exec turbo run build --filter=@billing/api --filter=@billing/web
      # Google Drive backups in single-PC mode: the app's "Desktop app" Google client (docs/DEPLOY.md).
      # Until the owner adds these repository secrets, the app says Google Drive isn't set up.
      - name: Make the installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          DESKTOP_GOOGLE_CLIENT_ID: ${{ secrets.DESKTOP_GOOGLE_CLIENT_ID }}
          DESKTOP_GOOGLE_CLIENT_SECRET: ${{ secrets.DESKTOP_GOOGLE_CLIENT_SECRET }}
        run: pnpm --filter @billing/desktop package
      # the release is made first as a hidden draft (one release, never two at once), filled by the next
      # step, and made public only after the installed app passed its checks (last step)
      - name: A hidden draft release on the releases page
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R amn-kr/billing-erp-releases >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R amn-kr/billing-erp-releases --draft --title "$GITHUB_REF_NAME" \
                 --notes "Windows installer for BillinGo $GITHUB_REF_NAME. Download BillinGo-Setup-${GITHUB_REF_NAME#v}.exe below. Not code-signed yet: if Windows says \"Windows protected your PC\", choose More info › Run anyway."
          gh release edit "$GITHUB_REF_NAME" -R amn-kr/billing-erp-releases --draft=true
      - name: Make the installer and put it into the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          # an access key for the public releases page (amn-kr/billing-erp-releases), made by the owner
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          DESKTOP_GOOGLE_CLIENT_ID: ${{ secrets.DESKTOP_GOOGLE_CLIENT_ID }}
          DESKTOP_GOOGLE_CLIENT_SECRET: ${{ secrets.DESKTOP_GOOGLE_CLIENT_SECRET }}
        run: pnpm --filter @billing/desktop package -- --publish
      - name: Install it (silently, for this Windows user)
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/release/*-Setup-*.exe | Select-Object -First 1
          Write-Host "Installing $($setup.Name) ($([math]::Round($setup.Length / 1MB)) MB)"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter billing-erp.exe | Select-Object -First 1
          if (-not $exe) { throw 'The installed app was not found' }
          "EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # a real Windows printer for the print check: "Microsoft Print to PDF" writing to a file, no dialog
      - name: A test printer (Microsoft Print to PDF, to a file)
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\printed.pdf"
          Add-PrinterPort -Name $out
          Add-Printer -Name 'Test PDF' -DriverName 'Microsoft Print To PDF' -PortName $out
          "PRINT_TEST_PRINTER=Test PDF" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PRINT_TEST_FILE=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Open the installed app (and print with it)
        working-directory: apps/desktop
        run: node scripts/smoke-installed.mjs "$EXE"
      - name: Make the release public (the installed app passed its checks)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          files=$(gh release view "$GITHUB_REF_NAME" -R amn-kr/billing-erp-releases --json assets --jq '.assets[].name')
          echo "$files"
          # the installer, and latest.yml (installed apps read it to find updates)
          echo "$files" | grep -q '^latest.yml$' || { echo 'latest.yml is missing'; exit 1; }
          echo "$files" | grep -q -- '-Setup-.*\.exe$' || { echo 'the installer is missing'; exit 1; }
          gh release edit "$GITHUB_REF_NAME" -R amn-kr/billing-erp-releases --draft=false --latest
      - name: Keep the installer (Artifacts, 14 days)
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/release/*-Setup-*.exe
          retention-days: 14
