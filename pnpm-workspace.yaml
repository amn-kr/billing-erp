packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@swc/core"
  - esbuild
  - prisma
ignoredBuiltDependencies:
  - "@nestjs/core"

# Security fixes for packages that a library pins to an old version (see each line). Remove a line
# once the library itself moves on.
overrides:
  # exceljs 4.4.0 (latest) asks for uuid ^8; uuid 11 keeps the same functions (and CommonJS)
  "exceljs>uuid": "11.1.1"
